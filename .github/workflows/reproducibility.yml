name: Reproducibility

on:
  push:
  pull_request:

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned analysis dependencies
        run: python -m pip install -r analysis/requirements-lock.txt

      - name: Validate canonical data
        run: python analysis/validate_data.py

      - name: Reproduce analysis tables
        run: python analysis/reproduce_analysis.py

      - name: Ensure analysis outputs stay committed
        run: git diff --exit-code -- analysis/results

      - name: Recreate publication figures
        run: python analysis/make_figures.py

  react-native-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/react-native-benchmark-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: apps/react-native-benchmark-app/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint React Native sources
        run: npm run lint

      - name: Type-check React Native sources
        run: npm run typecheck

      - name: Run Jest tests
        run: npm test -- --runInBand

  architecture-switch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Toggle architecture legacy -> new -> legacy
        run: |
          python scripts/configure_rn_architecture.py legacy
          python scripts/configure_rn_architecture.py new
          python scripts/configure_rn_architecture.py legacy

      - name: Require a clean diff after round-trip toggle
        run: git diff --exit-code -- apps/react-native-benchmark-app/android/gradle.properties apps/react-native-benchmark-app/modules/CommunicationModule.ts
